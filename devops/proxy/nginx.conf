# ---------------------------------------------------------------------------
# nginx in front of Artifact Room (alternative to ../proxy/Caddyfile).
#
# Two server blocks, one upstream: the app branches on the Host header, so
# both origins proxy to the same container. TLS certs are yours to provision
# (certbot/acme.sh); the `ssl_certificate` lines below are placeholders.
#
# Include from the `http {}` context, e.g. /etc/nginx/conf.d/artifact-room.conf
# ---------------------------------------------------------------------------

upstream artifact_room {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Creator app — dashboard, auth, upload.
server {
    listen 443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    # Uploads: keep in sync with the app's artifact size limit.
    client_max_body_size 10m;

    location / {
        proxy_pass http://artifact_room;
        proxy_http_version 1.1;
        # Host is load-bearing: the app routes creator vs viewer on it.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
}

# Viewer origin — sandboxed artifact rendering only. Deliberately identical
# proxying; isolation is enforced by the app (separate origin + CSP), not here.
server {
    listen 443 ssl;
    http2 on;
    server_name view.example.com;

    ssl_certificate     /etc/letsencrypt/live/view.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/view.example.com/privkey.pem;

    location / {
        proxy_pass http://artifact_room;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
}

# Redirect all plain HTTP to HTTPS.
server {
    listen 80;
    server_name app.example.com view.example.com;
    return 301 https://$host$request_uri;
}
