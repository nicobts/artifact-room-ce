name: Bug report
description: Report a defect (NOT a security vulnerability — see SECURITY.md)
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Use the Security tab's
        private vulnerability reporting or the contact in `SECURITY.md`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - Creator dashboard (authed)
        - Viewer / artifact render (token-gated)
        - Upload / scanning
        - Shares / access control
        - Analytics
        - Deployment / container / ops
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Self-hosted (Docker)
        - Local dev
        - Hosted demo
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste structured logs if available. Redact tokens/emails/IPs.
      render: shell
